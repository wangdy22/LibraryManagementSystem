# ==================== Server ====================
server.port=8080
# Mount the API under /api so the frontend can call http://localhost:8080/api/...
server.servlet.context-path=/api

# ==================== Database (MySQL) ====================
# Edit these or pass DB_URL, DB_USER, DB_PASSWORD env vars when running.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/library_db}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Create tables automatically
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# ==================== CORS ====================
# Allow calls from Vite dev server by default
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
